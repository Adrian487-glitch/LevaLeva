<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lag ny tur</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <script src="Script.js" defer></script>
  <body>
    <div class="header">
      <img class="logo" src="/Bilder/levaleva.png" alt="" />
      <div class="pages">
        <a href="Index.html">Hjem</a>
        <a style="background-color: darkcyan" href="">Ny tur</a>
        <a href="finn turer.html">Finn turer</a>
      </div>
    </div>
    <h1>Opprett ny tur</h1>
    <div style="display: flex; gap: 20px">
      <button
        class="lag-knapper"
        style="
          margin-left: 43%;
          padding: 10px;
          border-radius: 15px;
          font-size: 16px;
        "
        onclick="openingModal2('ny')"
      >
        Opprett her
      </button>
      <button
        class="lag-knapper"
        style="padding: 10px; border-radius: 15px; font-size: 16px"
        onclick="openingModal2('rediger')"
      >
        Rediger tur her
      </button>
    </div>
    <div id="Opprettmodal" class="hiddenModal">
      <div class="modalInnhold">
        <form id="turskjema" action="">
          <label for="turnavn">Turnavn</label>
          <input placeholder="Navn" type="text" id="turnavn" name="turnavn" />
          <label for="dato">Dato</label>
          <input placeholder="Dato" type="date" id="dato" name="dato" />
          <label for="klokkeslett">Klokkeslett</label>
          <input
            placeholder="Klokkeslett"
            type="time"
            id="klokkeslett"
            name="klokkeslett"
          />
          <label for="plasser">Antall plasser</label>
          <input
            placeholder="Antall plasser"
            type="number"
            id="plasser"
            name="plasser"
          />
          <label for="turleder">Turleder</label>
          <input
            placeholder="Turleder"
            type="text"
            id="turleder"
            name="turleder"
          />
          <label for="møteplass">Møteplass</label>
          <input
            placeholder="Møteplass"
            type="text"
            id="møteplass"
            name="møteplass"
          />
          <label for="destinasjon">Destinasjon</label>
          <input
            placeholder="Destinasjon"
            type="text"
            id="destinasjon"
            name="destinasjon"
          />
          <label for="varighet">Varighet</label>
          <input
            placeholder="Estimert varighet"
            type="text"
            id="varighet"
            name="varighet"
          />
          <label for="innformasjon">Informasjon</label>
          <textarea
            style="margin-bottom: 10px"
            placeholder="Ekstra informasjon"
            id="innformasjon"
            name="innformasjon"
          ></textarea>
        </form>
        <div style="display: flex; justify-content: center; gap: 10px">
          <button onclick="closingModal2()">Lukk</button>
          <button onclick="lagetTur()">Lag tur</button>
        </div>
      </div>
    </div>
    <div class="laget tur">
      <pre id="resultat"></pre>
    </div>
    <div class="footer">
      <p>LevaLeva</p>
    </div>
  </body>
</html>
