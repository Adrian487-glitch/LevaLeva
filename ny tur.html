<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lag ny tur</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <script src="Script.js" defer></script>
  <body>
    <div class="header">
      <img class="logo" src="/Bilder/levaleva.png" alt="" />
      <div class="pages">
        <a href="Index.html">Hjem</a>
        <a style="background-color: darkcyan" href="">Ny tur</a>
        <a href="finn turer.html">Finn turer</a>
      </div>
    </div>
    <h1 style="text-align: center">Opprett ny tur</h1>
    <div style="display: flex; gap: 20px">
      <button style="margin-left: 44%" onclick="openingModal2('ny')">
        Opprett her
      </button>
      <button onclick="openingModal2('rediger')">Rediger tur her</button>
    </div>
    <div id="Opprettmodal" class="hiddenModal">
      <div class="modalInnhold">
        <form id="turskjema" action="">
          <input placeholder="Navn" type="text" id="turnavn" name="turnavn" />
          <input placeholder="Dato" type="date" id="dato" name="dato" />
          <input
            placeholder="Klokkeslett"
            type="time"
            id="klokkeslett"
            name="klokkeslett"
          />
          <input
            placeholder="Antall plasser"
            type="number"
            id="plasser"
            name="plasser"
          />
          <input
            placeholder="Turleder"
            type="text"
            id="turleder"
            name="turleder"
          />
          <input
            placeholder="Møteplass"
            type="text"
            id="møteplass"
            name="møteplass"
          />
          <input
            placeholder="Destinasjon"
            type="text"
            id="destinasjon"
            name="destinasjon"
          />
          <input
            placeholder="Estimert varighet"
            type="text"
            id="varighet"
            name="varighet"
          />
          <textarea
            placeholder="Ekstra informasjon"
            id="innformasjon"
            name="innformasjon"
          ></textarea>
        </form>
        <div style="display: flex; justify-content: center; gap: 10px">
          <button onclick="closingModal2()">Lukk</button>
          <button onclick="lagetTur()">Lag tur</button>
        </div>
      </div>
    </div>
    <div class="laget tur">
      <pre id="resultat"></pre>
    </div>
  </body>
</html>
